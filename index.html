  <script>
    const title = document.getElementById('bannerTitle');
    const image = document.getElementById('bannerImage');

    function toggleBanner() {
      // 1. 淡出標題
      title.classList.add('hidden');

      // 2. 換成圖片，等 1 秒後淡入圖片
      setTimeout(() => {
        image.classList.remove('hidden');
      }, 1000);

      // 3. 5 秒後，淡出圖片
      setTimeout(() => {
        image.classList.add('hidden');
      }, 6000); // 1s 淡入 + 5s 顯示 = 6s

      // 4. 圖片淡出後，回到標題（再等 1 秒）
      setTimeout(() => {
        title.classList.remove('hidden');
      }, 7000);
    }
  </script>

  <script>
    // 吸頂導覽列自動隱藏功能
    document.addEventListener("DOMContentLoaded", () => {
      const nav = document.getElementById("mainNav");
      const searchInput = document.getElementById("searchInput");
      let hideTimeout;

      const showNav = () => {
        nav.classList.remove('hidden');
        if (hideTimeout) clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {
          nav.classList.add('hidden');
        }, 3000);
      };

      showNav();

      document.addEventListener('mousemove', showNav);

      let lastScrollY = window.scrollY;
      window.addEventListener('scroll', () => {
        if (window.scrollY !== lastScrollY) {
          showNav();
          lastScrollY = window.scrollY;
        }
      });

      // ✅ 當搜尋框輸入文字時，也延後隱藏
      if (searchInput) {
        searchInput.addEventListener('input', showNav);
      }
    });

    // 側邊目錄展開/收合
    document.querySelectorAll('.tree .toggle').forEach(function (toggle) {
      toggle.addEventListener('click', function () {
        this.parentElement.classList.toggle('open');
      });
    });

    // 載入主內容
    function loadContent(file) {
      fetch(file)
        .then(response => {
          if (!response.ok) throw new Error("載入失敗");
          return response.text();
        })
        .then(html => {
          document.getElementById('content').innerHTML = html;
        })
        .catch(error => {
          document.getElementById('content').innerHTML = "<p>無法載入內容。</p>";
          console.error(error);
        });
    }

    // 返回頂部按鈕
    document.addEventListener("DOMContentLoaded", function () {
      const backToTopBtn = document.getElementById("backToTop");

      window.addEventListener("scroll", () => {
        if (window.scrollY > 500) {
          backToTopBtn.style.display = "block";
        } else {
          backToTopBtn.style.display = "none";
        }
      });

      backToTopBtn.addEventListener("click", () => {
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      });
    });

    // 預設載入首頁內容
    document.addEventListener("DOMContentLoaded", () => {
      loadContent('home.html');
    });
  </script>

  <script>
    const searchFiles = [
      'home.html',
      'roadmap.html',
      'powerbi.html',
      'mysql.html',
      'git.html',
      'python.html',
      'htmnl.html',
      'spyder.html',
      'books.html',
      'content3.html',
      'content4.html',
      'plot_air_quality.html',
      'plot_example.html',
      'plot_bike.html'
    ];


    async function performSearch() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const container = document.getElementById('content');
      if (!keyword) {
        container.innerHTML = '<p>請輸入搜尋關鍵字</p>';
        return;
      }

      container.innerHTML = '<p>正在搜尋…</p>';
      const results = [];

      for (let file of searchFiles) {
        try {
          const resp = await fetch(file);
          if (!resp.ok) continue;
          const text = await resp.text();
          const plain = text.replace(/<[^>]+>/g, '').toLowerCase();

          if (plain.includes(keyword)) {
            const titleMatch =
              /<title>([^<]+)<\/title>/i.exec(text) ||
              /<h1>([^<]+)<\/h1>/i.exec(text) ||
              /<h2>([^<]+)<\/h2>/i.exec(text);
            const title = titleMatch ? titleMatch[1] : file;
            results.push(`<li><a href="#" onclick="loadContent('${file}')">${title}</a></li>`);
          }
        } catch (err) {
          console.error('搜尋錯誤：', err);
        }
      }

      if (results.length) {
        container.innerHTML = '<h3>🔍 搜尋結果：</h3><ol>' + results.join('') + '</ol>';
      } else {
        container.innerHTML = '<p>❌ 找不到符合的項目</p>';
      }
    }    
  </script>
