<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />

    <title>Day 2 — 旅行 & 會議 — Flashcards (1–150)</title>
    <style>
        :root {
            --bg: #f0f8f0;
            --card: #ffffff;
            --muted: #4a5d43;
            --accent: #2e4b2e;
            --shadow: rgba(46, 75, 46, 0.2);
            --border: #a3c9a3;
        }

        * {
            box-sizing: border-box
        }

        body {
            font-family: 'Georgia', 'Palatino Linotype', 'Book Antiqua', serif;
            margin: 0;
            background: var(--bg) url('https://www.transparenttextures.com/patterns/wood-pattern.png') repeat;
            /* 木質紋理 */
            color: var(--accent);
        }

        .wrap {
            max-width: 1100px;
            margin: 28px auto;
            padding: 18px
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-family: 'Georgia', serif;
            color: var(--accent);
        }

        p.lead {
            margin: 6px 0 18px;
            color: var(--muted)
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
            flex-wrap: wrap
        }

        .btn {
            background: #eaf4ea;
            border: 1px solid var(--border);
            padding: 8px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            box-shadow: 2px 2px 5px var(--shadow);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translateY(1px)
        }

        .card-area {
            perspective: 1200px
        }

        .card {
            width: 100%;
            height: 360px;
            border-radius: 16px;
            background: var(--card);
            box-shadow: 0 8px 20px var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 450ms cubic-bezier(.2, .8, .2, 1);
            border: 2px solid var(--border);
        }

        .card.flipped {
            transform: rotateY(180deg)
        }

        .face {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 26px;
            backface-visibility: hidden;
            font-family: 'Georgia', serif;
        }

        .front {
            font-weight: 700
        }

        .front .word {
            font-size: 48px;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .front .ex {
            color: var(--muted);
            font-size: 16px;
            font-style: italic;
        }

        .back {
            transform: rotateY(180deg);
            text-align: center
        }

        .back .zh {
            font-size: 36px;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .back .ex {
            color: var(--muted);
            font-size: 16px;
            font-style: italic;
        }

        .meta {
            position: absolute;
            left: 14px;
            top: 12px;
            color: var(--muted);
            font-size: 13px
        }

        .nav {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .preview {
            margin-top: 14px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px
        }

        .chip {
            background: #eaf4ea;
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 12px;
            text-align: left;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 1px 1px 4px var(--shadow);
            font-family: 'Georgia', serif;
        }

        .footer {
            margin-top: 14px;
            color: var(--muted);
            font-size: 13px;
            font-style: italic;
        }

        input[type=number] {
            width: 100px;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-family: 'Georgia', serif;
        }

        @media (max-width:640px) {
            .card {
                height: 260px
            }

            .front .word {
                font-size: 34px
            }

            .back .zh {
                font-size: 24px
            }
        }
    </style>

        </div>

        <div
            style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:12px">
            <div class="nav">

                <button class="btn" id="nextBtn">下一張</button>
                <button class="btn" id="flipBtn">翻面</button>

        </section>

        // Utilities
        function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[b[i], b[j]] = [b[j], b[i]] } return b }

        // State
        let deck = shuffle(VOCAB.slice());
        let idx = 0;
        let flipped = false;
        let autoplay = false;
        let timer = null;

        // Elements
        const cardEl = document.getElementById('card');
        const wordEl = document.getElementById('word');
        const exEl = document.getElementById('ex');
        const zhEl = document.getElementById('zh');
        const zhExEl = document.getElementById('zhEx');
        const metaFront = document.getElementById('metaFront');
        const counter = document.getElementById('counter');
        const previewGrid = document.getElementById('previewGrid');
        const intervalInput = document.getElementById('interval');
        const autoBtn = document.getElementById('autoBtn');
        const exportBtn = document.getElementById('exportBtn');

        function render() {
            const c = deck[idx];
            wordEl.textContent = c.en;
            exEl.textContent = c.enEx;
            zhEl.textContent = c.zh;
            zhExEl.textContent = c.zhEx;
            metaFront.textContent = 'No. ' + c.no;
            counter.textContent = `卡片 ${idx + 1} / ${deck.length}`;
            cardEl.classList.toggle('flipped', flipped);

            // speakWord(c.en);            
        }

        function nextCard() { idx = (idx + 1) % deck.length; flipped = false; render(); const c = deck[idx]; speakWord(c.en); }
        function prevCard() { idx = (idx - 1 + deck.length) % deck.length; flipped = false; render(); const c = deck[idx]; speakWord(c.en); }
        function randomCard() { idx = Math.floor(Math.random() * deck.length); flipped = false; render(); const c = deck[idx]; speakWord(c.en); }
        function reshuffle() { deck = shuffle(deck); idx = 0; flipped = false; render(); buildPreview(); }

        function startAuto() { autoplay = true; autoBtn.textContent = '停止自動'; timer = setInterval(() => { nextCard(); }, Math.max(500, Number(intervalInput.value) || 2000)); }
        function stopAuto() { autoplay = false; autoBtn.textContent = '開始自動'; clearInterval(timer); timer = null; }
        function toggleAuto() { if (autoplay) stopAuto(); else startAuto(); }

        // Events
        document.getElementById('shuffleBtn').addEventListener('click', () => { reshuffle(); });
        document.getElementById('randomBtn').addEventListener('click', () => { randomCard(); });
        document.getElementById('nextBtn').addEventListener('click', () => { nextCard(); });
        document.getElementById('prevBtn').addEventListener('click', () => { prevCard(); });
        document.getElementById('flipBtn').addEventListener('click', () => { flipped = !flipped; render(); });
        autoBtn.addEventListener('click', () => { toggleAuto(); });
        exportBtn.addEventListener('click', () => { exportCSV(); });

        cardEl.addEventListener('click', () => { flipped = !flipped; render(); });
        cardEl.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); flipped = !flipped; render(); }
            if (e.key === 'ArrowRight') { nextCard(); }
            if (e.key === 'ArrowLeft') { prevCard(); }
        });

        intervalInput.addEventListener('change', () => { if (autoplay) { stopAuto(); startAuto(); } });

        // Build preview grid
        function buildPreview() {
            previewGrid.innerHTML = ''; deck.forEach((d, i) => {
                const btn = document.createElement('button'); btn.className = 'chip'; btn.textContent = d.no + '. ' + d.en; btn.addEventListener('click', () => { idx = i; flipped = false; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }); previewGrid.appendChild(btn);
            })
        }

        // Export current deck to CSV
        function exportCSV() {
            const rows = [['No', 'Vocabulary', 'Chinese', 'Example (EN)', '例句 (中)']];
            deck.forEach(d => rows.push([d.no, d.en, d.zh, d.enEx, d.zhEx]));
            const csv = rows.map(r => r.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'Day1_Flashcards_1-150.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        }

        // Init
        render(); buildPreview();

        // Global keyboard navigation when card not focused
        window.addEventListener('keydown', (e) => {
            if (document.activeElement === cardEl) return;
            if (e.key === 'ArrowRight') { nextCard(); }
            if (e.key === 'ArrowLeft') { prevCard(); }
            if (e.code === 'Space') { e.preventDefault(); flipped = !flipped; render(); }
        });

        const speakBtn = document.getElementById('speakBtn');

        function speakWord(word) {
            if (!window.speechSynthesis) return;
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US'; // 英文發音
            window.speechSynthesis.cancel(); // 先停止前一個發音
            window.speechSynthesis.speak(utterance);
        }

        // 點擊按鈕發音

        speakBtn.addEventListener('click', (event) => {
            event.stopPropagation(); // 阻止冒泡，不會觸發卡片翻面
            speakWord(deck[idx].en);
        });

    </script>
