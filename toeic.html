<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC單字練習</title>
<style>
  :root{
    --bg:#f0f8f0;
    --card:#ffffff;
    --muted:#4a5d43;
    --accent:#2e4b2e;
    --shadow:rgba(46,75,46,0.2);
    --border:#a3c9a3;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Georgia', 'Palatino Linotype', 'Book Antiqua', serif;
    margin:0;
    background:var(--bg) url('https://www.transparenttextures.com/patterns/wood-pattern.png') repeat;
    color:var(--accent);
  }
  .wrap{
    max-width:1100px;
    margin:28px auto;
    padding:18px;
  }
  header h1{
    margin:0;
    font-size:28px;
    font-family:'Georgia', serif;
    color:var(--accent);
    text-align:center;
    margin-bottom:24px;
  }
  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:16px;
  }
  .card{
    height:220px;
    border-radius:16px;
    background:var(--card);
    box-shadow:0 6px 16px var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    border:2px solid var(--border);
    transition: transform 0.2s, box-shadow 0.2s;
    text-decoration: none;
    color:var(--accent);
    font-weight:bold;
    font-size:20px;
    text-align:center;
    padding:12px;
  }
  .card:hover{
    transform: translateY(-4px);
    box-shadow:0 10px 20px var(--shadow);
  }
  @media(max-width:640px){
    .card{height:160px; font-size:16px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TOEIC單字練習</h1>
  </header>
  <div class="card-grid">
    <a href="toeic-day01.html" class="card">TOEIC-Day01<br>辦公室 & 公司</a>
    <a href="toeic-day02.html" class="card">TOEIC-Day02<br>旅行 & 會議</a>
    <a href="toeic-day03.html" class="card">TOEIC-Day03<br>財務 & 行銷</a>
    <a href="toeic-day04.html" class="card">TOEIC-Day04<br>產品 & 客服</a>
    <a href="toeic-day05.html" class="card">TOEIC-Day05<br>法律 & 合約</a>
    <a href="toeic-day06.html" class="card">TOEIC-Day06<br>物流 & 工廠</a>

  </div>
</div>
</body>
</html>
